<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panorama</title>
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Seu jornal pessoal: as notícias do dia, confirmadas e organizadas.">
  <meta name="theme-color" content="#16203a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Panorama">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2316203A'/><rect x='7' y='18' width='4' height='7' fill='%23E8EDF5'/><rect x='14' y='12' width='4' height='13' fill='%23E8EDF5'/><rect x='21' y='7' width='4' height='18' fill='%23E8EDF5'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#view">Pular para as notícias</a>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#/" aria-label="Panorama, capa">Panorama</a>
      <p class="dateline" id="dateline"></p>
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search-input">Buscar notícias</label>
        <input id="search-input" name="q" type="search" placeholder="Buscar um assunto, pessoa ou lugar" autocomplete="off" minlength="2">
      </form>
      <div class="refresh">
        <span id="updated" aria-live="polite"></span>
        <button type="button" id="refresh-btn" class="icon-btn" title="Recarregar a edição" aria-label="Recarregar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
        <button type="button" id="theme-btn" class="icon-btn" title="Alternar tema claro e escuro" aria-label="Alternar tema">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
        </button>
      </div>
    </div>
    <nav class="sections" id="sections" aria-label="Editorias"></nav>
  </header>

  <div class="indicators" id="indicators" aria-label="Indicadores do Banco Central"></div>

  <button type="button" class="fresh-pill" id="fresh-pill" hidden>Há matérias novas. Mostrar</button>

  <main id="view" tabindex="-1"></main>

  <footer class="colophon">
    <p>As matérias do Panorama são escritas só com o que veículos profissionais publicaram, e só quando duas ou mais redações confirmam o fato. Indicadores: Banco Central. <a href="#/bastidores">Bastidores</a>.</p>
  </footer>

  <dialog class="story" id="story" aria-labelledby="story-title">
    <div class="story-inner">
      <button type="button" class="icon-btn story-close" id="story-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="story-body"></div>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
