# Robô do Panorama: busca as notícias, gera a edição e publica no GitHub Pages.
# Roda sozinho a cada 15 minutos (o GitHub pode atrasar alguns minutos), a cada mudança no
# código e quando acionado à mão na aba Actions. Gratuito para repositórios públicos.

name: Edição

on:
  # Minutos "quebrados": no começo de cada hora o GitHub fica sobrecarregado e descarta
  # agendamentos gratuitos com mais frequência.
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # guardar os dias fechados do arquivo na branch `arquivo`
  pages: write
  id-token: write
  actions: write

# Uma edição de cada vez; se outra começar, a anterior termina primeiro.
concurrency:
  group: edicao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      - id: pages
        uses: actions/configure-pages@v5

      # Dias fechados do arquivo (cifrados) moram na branch `arquivo`.
      - name: Trazer o arquivo
        run: |
          if git ls-remote --exit-code --heads origin arquivo > /dev/null; then
            git fetch --depth=1 origin arquivo
            git worktree add --detach arquivo-repo FETCH_HEAD
          else
            mkdir -p arquivo-repo
          fi

      # Com o segredo PANORAMA_SENHA, a edição sai criptografada e com o texto completo.
      - name: Gerar a edição
        env:
          PANORAMA_SENHA: ${{ secrets.PANORAMA_SENHA }}
        run: node scripts/edicao.js --saida site --base "${{ steps.pages.outputs.base_url }}" --arquivo arquivo-repo

      - name: Guardar os dias fechados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd arquivo-repo
          if [ ! -e .git ]; then
            git init -q -b arquivo
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "Robô do Panorama"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nenhum dia novo para guardar."; exit 0; fi
          git commit -q -m "arquivo: dias fechados"
          git push origin HEAD:arquivo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # O GitHub desliga agendamentos de repositórios sem atividade por 60 dias.
      # Reativar a cada execução mantém o robô rodando indefinidamente.
      - name: Manter o agendamento ativo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/edicao.yml/enable" || true
